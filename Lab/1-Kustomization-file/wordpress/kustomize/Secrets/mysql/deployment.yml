apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      volumes:
        - name: mysql-persistent-storage
          emptyDir: {}
      containers:
        - image: mysql:5.6
          name: mysql
          # O containerd expõe nofile "infinito" (~1e9) ao container e o mysqld
          # 5.6 dimensiona alocações a partir desse limite, sendo morto por OOM
          # antes de iniciar. Fixar o ulimit resolve; não há campo nativo para
          # ulimits no Pod spec, por isso o wrapper no command.
          command:
            - bash
            - -c
            - "ulimit -n 1024; exec /entrypoint.sh mysqld"
          envFrom:
            - secretRef:
                name: mysql-secret
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "900Mi"
              cpu: "300m"