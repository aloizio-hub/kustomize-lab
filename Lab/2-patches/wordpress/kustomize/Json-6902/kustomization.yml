apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- pairs:
    version: json-6902
  includeTemplates: true


namePrefix: json-6902-
namespace: json-6902

patchesJson6902:
  - path: patches/patch-limits-2.yml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mysql

# patches:
#   - target:
#       kind: Deployment
#       name: mysql
#     patch: |-
#       - op: replace
#         path: /spec/template/spec/containers/0/resources/limits
#         value:
#           cpu: 400m
#           memory: 500Mi
      
#       - op: replace
#         path: /spec/template/spec/containers/0/resources/requests
#         value:
#           cpu: 100m
#           memory: 100Mi


resources:
- mysql
- ../base
- namespace.yml


# Desde o kustomize v4 os dois foram unificados em patches, que detecta o tipo automaticamente pelo conteúdo: se começa com uma lista de operações op:, é JSON 6902; se é um fragmento
  # de manifesto, é strategic merge. PatchesStrategicMerge ainda funciona no v5.8.1, mas emite depreciação — use patches em código novo.
  
  # Resumo
  
  # ┌──────────┬─────────────────────────────────────────────────────────┐
  # │          │ o que é                                                 │
  # ├──────────┼─────────────────────────────────────────────────────────┤
  # │ patches: │ campo do kustomization, lista de patches a aplicar      │
  # ├──────────┼─────────────────────────────────────────────────────────┤
  # │ path:    │ aponta para um arquivo com o patch                      │
  # ├──────────┼─────────────────────────────────────────────────────────┤
  # │ patch:   │ o patch escrito inline, na própria kustomization        │
  # ├──────────┼─────────────────────────────────────────────────────────┤
  # │ target:  │ seletor opcional do alvo (kind, name, labelSelector...) │
  # └──────────┴─────────────────────────────────────────────────────────┘